spring.application.name=event-service
server.port=8082
identity.service.url=${IDENTITY_SERVICE_URL:http://localhost:8081}
booking.service.url=${BOOKING_SERVICE_URL:http://localhost:8083}

# Database configuration
spring.datasource.url=jdbc:h2:file:./data/eventdb;AUTO_SERVER=TRUE
spring.datasource.username=mohammad
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console configuration
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

