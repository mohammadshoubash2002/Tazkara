spring.application.name=booking-service
server.port=8083
identity.service.url=${IDENTITY_SERVICE_URL:http://localhost:8081}
event.service.url=${EVENT_SERVICE_URL:http://localhost:8082}

# Database configuration
spring.datasource.url=jdbc:h2:file:./data/bookingdb;AUTO_SERVER=TRUE
spring.datasource.username=mohammad
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console configuration
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT
app.jwt.secret=qxtMAVQc8QmXdpZH9gElXGQeLRsZsOqJVa6yQdJM1aU
# 30 minutes expiration - 1000 * 60 * 30
app.jwt.expiration-ms=1800000

# Booking Hold Expiry & Automatic Release Job (Configurable)
booking.hold-expiry-minutes=${BOOKING_HOLD_EXPIRY_MINUTES:10}
booking.release-unpaid-fixed-rate-ms=${BOOKING_RELEASE_UNPAID_FIXED_RATE_MS:60000}
